name: Atualizar cards do perfil

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Gerar estatisticas publicas
        uses: readme-tools/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be # v1 consultada em 19/10/2026
        with:
          card: stats
          options: username=italomarques2&show_icons=true&hide_rank=true&theme=transparent&title_color=a78bfa&icon_color=22d3ee&text_color=94a3b8&hide_border=true&locale=pt-br
          path: assets/stats.svg
          token: ${{ github.token }}
          fail_on_error: 'true'
      - name: Gerar linguagens dos repositorios publicos
        uses: readme-tools/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be
        with:
          card: top-langs
          options: username=italomarques2&layout=compact&theme=transparent&title_color=a78bfa&text_color=94a3b8&hide_border=true&locale=pt-br
          path: assets/languages.svg
          token: ${{ github.token }}
          fail_on_error: 'true'
      - name: Salvar os cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/languages.svg
          if git diff --cached --quiet; then
            echo "Os cards ja estao atualizados."
          else
            git commit -m "docs: atualizar cards de atividade publica"
            git push
          fi
